<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>my-web · 방명록</title>
    <link rel="stylesheet" href="styles.css">
    <script src="guestbook.js" defer></script>
  </head>
  <body>
    <header>
      <h1>방명록</h1>
      <nav>
        <a href="index.html">홈</a>
        <a href="about.html">내 정보</a>
        <a href="guestbook.html">방명록</a>
      </nav>
    </header>
    <main>
      <h2>한 줄 남기기</h2>
      <p>이름과 메시지를 입력해 방명록을 남겨 보세요. 이메일은 선택 항목입니다.</p>
      <h3>쓰는 순서</h3>
      <ol>
        <li>이름을 적는다.</li>
        <li>이메일은 필요하면 적고, 메시지를 적는다.</li>
        <li>남기기 버튼을 누른다.</li>
        <li>내가 남긴 글은 삭제 버튼으로 지울 수 있다.</li>
      </ol>
      <form id="guestbook-form">
        <p>
          <label for="name">이름</label>
          <input id="name" type="text" maxlength="30" required>
        </p>
        <p>
          <label for="email">이메일 (선택)</label>
          <input id="email" type="email">
        </p>
        <p>
          <label for="message">메시지</label>
          <textarea id="message" rows="4" maxlength="300" required></textarea>
        </p>
        <button type="submit">남기기</button>
      </form>
      <p id="notice" role="status" aria-live="polite"></p>
      <h3>남긴 글</h3>
      <ul class="card" id="list"></ul>
      <p id="empty">아직 남긴 글이 없습니다.</p>
      <p id="count" aria-live="polite">0개</p>
    </main>
    <footer>
      <p>수업용 연습 페이지 · student01</p>
    </footer>
  </body>
</html>
